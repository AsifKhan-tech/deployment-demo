name: Demo deployment on Excloud # Define GitHub Actions workflow name

on: # YAML key, it defines when workflow should execute
  push: # GitHub event, it triggers when code pushes
    branches: # Specifies which branch's push event should be listen
      - main # - Represent list item in YAML. Deployment will start when push in main

jobs: # Define which jobs will be executed within a workflow
  deploy: # Job identifier
    runs-on: ubuntu-latest # Define that in which environment job will excute

    steps: # Define individaul tasks that the job will execute
      - name: Checkout code # Display name (see in logs)
        uses: actions/checkout@v5 # uses means execute existing GitHub Action

      - name: Login to Docker Hub # Login to
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          docker build -t asifdotcom/demo:tagname .
          docker push asifdotcom/demo:tagname

      - name: Deploy on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.74.156.47
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e

            sudo docker rm -f demo-app || true

            for container_id in $(sudo docker ps -aq --filter "publish=80"); do
              sudo docker rm -f "$container_id"
            done

            sudo docker pull asifdotcom/demo:tagname

            sudo docker run -d \
              --name demo-app \
              --restart unless-stopped \
              -p 80:3000 \
              asifdotcom/demo:tagname
