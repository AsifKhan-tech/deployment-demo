name: Demo deployment on Excloud
on: # Event
  push:
    branches:
      - main
jobs: # Steps
  deploy:
    runs-on: ubuntu-latest #GitHub machine
    steps:
      - name: Checkout code # Checkout current code
        uses: actions/checkout@v4 # plugin
      - name: Deploy on Excloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.74.156.40 # VPS
          username: ubuntu # Kis username se SSH karna hai
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            export PATH=$PATH:/home/ubuntu/.local/share/pnpm:/home/ubuntu/.nvm/versions/node/$(nvm current)/bin
            cd /home/ubuntu/deployment-demo
            git pull origin main
            /home/ubuntu/.local/share/pnpm/pnpm i
            npx pm2 restart 0
