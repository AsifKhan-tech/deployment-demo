name: Demo deployment on Excloud
on: # Event
  push:
    branches:
      - main
jobs: # Steps
  deploy:
    runs-on: ubuntu-latest #GitHub machine
    steps:
      - name: Checkout code # Checkout current code
        uses: actions/checkout@v4 # plugin
      - name: Deploy on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.74.156.41 # VPS
          username: ubuntu # Kis username se SSH karna hai
          key: ${{secrets.PRIVATE_KEY}}
          script: |
            cd /home/ubuntu/deployment-demo
            git pull
            pnpm install
            pm2 restart 0
