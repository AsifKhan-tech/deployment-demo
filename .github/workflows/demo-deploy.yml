name: Demo deployment on Excloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub # Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          docker build -t asifdotcom/demo:tagname .
          docker push asifdotcom/demo:tagname

      - name: Deploy on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.74.156.47
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -e

            for container_id in $(sudo docker ps -aq --filter "publish=3000"); do
              sudo docker rm -f "$container_id"
            done

            sudo docker pull asifdotcom/demo:tagname
            sudo docker run -d \
              --name demo-app \
              --restart unless-stopped \
              -p 80:3000 \
              asifdotcom/demo:tagname
